<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="32" height="24">
  <rect width="640" height="120" fill="#AA151B"/>
  <rect y="120" width="640" height="240" fill="#F1BF00"/>
  <rect y="360" width="640" height="120" fill="#AA151B"/>
  <!-- Spanish Coat of Arms on the hoist -->
  <g transform="translate(200, 240) scale(0.95)">
    <!-- Left Pillar of Hercules -->
    <rect x="-65" y="-55" width="8" height="100" fill="#AA151B"/>
    <circle cx="-61" cy="-60" r="7" fill="#F1BF00"/>
    <rect x="-70" y="45" width="18" height="8" fill="#AA151B"/>
    <path d="M -75,-10 H -47 V 5 H -75 Z" fill="#F1BF00" opacity="0.9"/>
    <!-- Right Pillar of Hercules -->
    <rect x="57" y="-55" width="8" height="100" fill="#AA151B"/>
    <circle cx="61" cy="-60" r="7" fill="#F1BF00"/>
    <rect x="52" y="45" width="18" height="8" fill="#AA151B"/>
    <path d="M 47,-10 H 75 V 5 H 47 Z" fill="#F1BF00" opacity="0.9"/>
    <!-- Royal Crown -->
    <path d="M -30,-48 Q 0,-70 30,-48 L 24,-36 Q 0,-42 -24,-36 Z" fill="#AA151B"/>
    <circle cx="-25" cy="-48" r="4" fill="#F1BF00"/>
    <circle cx="0" cy="-55" r="5" fill="#F1BF00"/>
    <circle cx="25" cy="-48" r="4" fill="#F1BF00"/>
    <!-- Shield -->
    <path d="M -35,-32 H 35 V 20 Q 35 60 0 75 Q -35 60 -35 20 Z" fill="#AA151B" stroke="#F1BF00" stroke-width="4"/>
    <path d="M -28,-26 H 28 V 16 Q 28 50 0 64 Q -28 50 -28 16 Z" fill="#FFFFFF"/>
    <!-- Quarters -->
    <rect x="-26" y="-24" width="24" height="26" fill="#AA151B"/>
    <rect x="2" y="-24" width="24" height="26" fill="#FFFFFF"/>
    <rect x="-26" y="4" width="24" height="26" fill="#F1BF00"/>
    <rect x="2" y="4" width="24" height="26" fill="#AA151B"/>
    <circle cx="0" cy="8" r="8" fill="#002395" stroke="#F1BF00" stroke-width="2"/>
  </g>
</svg>