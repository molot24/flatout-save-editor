<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="32" height="24">
  <rect width="640" height="480" fill="#006C35"/>
  <!-- Arabic Calligraphy stylized central block -->
  <g fill="#FFFFFF" transform="translate(320, 195) scale(1.15)">
    <!-- Stylized Arabic calligraphy lines -->
    <path d="M -150,-45 H 150 V -35 H -150 Z" opacity="0.95"/>
    <path d="M -130,-30 C -80,-60 -20,-30 40,-60 C 90,-30 140,-50 140,-30 C 140,-10 90,-10 40,-15 C -20,-20 -80,-10 -130,-30 Z"/>
    <path d="M -140,-10 Q -70,25 0,-5 Q 70,25 140,-10 L 135,2 Q 70,35 0,10 Q -70,35 -135,2 Z"/>
    <path d="M -120,-70 V -45 M -90,-75 V -45 M -60,-70 V -45 M -20,-75 V -45 M 20,-75 V -45 M 60,-70 V -45 M 100,-75 V -45 M 120,-70 V -45" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-105" cy="-25" r="5"/>
    <circle cx="-40" cy="-25" r="5"/>
    <circle cx="0" cy="-35" r="5"/>
    <circle cx="40" cy="-25" r="5"/>
    <circle cx="80" cy="-35" r="5"/>
  </g>
  <!-- Iconic Sword pointing to the left -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round" transform="translate(320, 315)">
    <!-- Blade (pointing left) -->
    <path d="M 120,-5 L -140,-5 Q -175,-4 -180,0 Q -175,4 -140,5 L 120,5 Z" fill="#FFFFFF"/>
    <!-- Sword Guard / Quillons -->
    <rect x="120" y="-18" width="10" height="36" rx="4" fill="#FFFFFF"/>
    <circle cx="125" cy="-18" r="4" fill="#FFFFFF"/>
    <circle cx="125" cy="18" r="4" fill="#FFFFFF"/>
    <!-- Hilt / Handle -->
    <rect x="130" y="-6" width="35" height="12" rx="2" fill="#FFFFFF"/>
    <!-- Pommel -->
    <circle cx="168" cy="0" r="10" fill="#FFFFFF"/>
    <path d="M 168,-10 Q 185,-15 175,8 Q 165,15 168,10 Z" fill="#FFFFFF"/>
  </g>
</svg>